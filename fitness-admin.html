<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ออกกำลังกายและฟิตเนส 15 ครั้ง | GA Operations</title>
    <link rel="stylesheet" href="fitness-admin.css?v=20261027-5">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
</head>
<body>
    <main class="fa-page">
        <header class="fa-head">
            <div>
                <p class="fa-eyebrow">EXERCISE &amp; FITNESS · หลังบ้าน</p>
                <h1>ออกกำลังกายและฟิตเนส 15 ครั้ง</h1>
                <p class="fa-sub">ตรวจรูปหลักฐาน วันที่ และลายเซ็นของพนักงาน — ข้อมูลเก็บที่ Google Drive <span id="faUpdated"></span></p>
            </div>
            <div class="fa-actions">
                <a id="faPublicLink" class="fa-btn fa-btn-ghost" href="exercise.html" target="_blank" rel="noopener" title="หน้าที่พนักงานใช้อัปโหลดรูป — ส่งลิงก์ของหน้านี้ให้พนักงาน">หน้าเว็บสำหรับพนักงาน ↗</a>
                <button id="faLock" type="button" class="fa-btn" data-action="toggle-lock">…</button>
            </div>
        </header>

        <section class="fa-stats" id="faStats"></section>

        <section class="fa-toolbar">
            <label id="faMonthLabel">เดือน <select id="faMonth"></select></label>
            <div class="fa-chips" id="faTypeChips">
                <button type="button" data-type="" class="is-on">ทุกแบบฟอร์ม</button>
                <button type="button" data-type="กิจกรรม30วัน">กิจกรรม 30 วัน</button>
                <button type="button" data-type="ออกกำลังกายทั่วไป15ครั้ง">ทั่วไป 15 ครั้ง</button>
                <button type="button" data-type="ค่าฟิตเนสรายเดือน">ฟิตเนสรายเดือน</button>
            </div>
            <select id="faCompany" title="กรองตามบริษัท"><option value="">ทุกบริษัท</option></select>
            <select id="faStatus">
                <option value="">ทุกสถานะ</option>
                <option value="complete">ส่งครบแล้ว</option>
                <option value="incomplete">ยังส่งไม่ครบ</option>
                <option value="pending">รอตรวจ</option>
                <option value="approved">ผ่าน</option>
                <option value="rejected">ไม่ผ่าน</option>
            </select>
            <input id="faSearch" type="search" placeholder="ค้นหาชื่อ รหัสพนักงาน บริษัท…" autocomplete="off">
            <button type="button" class="fa-btn fa-btn-ghost" data-action="export-pdf" title="รายการที่แสดงอยู่ 1 คนต่อชุดหน้า พร้อมรูปทุกวันและลายเซ็น">ดาวน์โหลด PDF</button>
            <button type="button" class="fa-btn fa-btn-ghost" data-action="export-xlsx" title="รายการที่แสดงอยู่ 1 คนต่อ 1 แผ่นงาน เหมือนแบบฟอร์มเดิม">ดาวน์โหลด XLSX</button>
        </section>

        <section class="fa-card">
            <div class="fa-table-wrap">
                <table>
                    <thead><tr><th>พนักงาน</th><th>แบบฟอร์ม</th><th>รูป</th><th>วันที่</th><th>ลายเซ็น</th><th>สถานะส่ง</th><th>ผลตรวจ</th><th>อัปเดต</th><th></th></tr></thead>
                    <tbody id="faRows"><tr><td colspan="9" class="fa-empty">กำลังโหลด…</td></tr></tbody>
                </table>
            </div>
        </section>
    </main>

    <dialog id="faDialog" class="fa-dialog">
        <div id="faDetail"></div>
    </dialog>
    <dialog id="faExportDialog" class="fa-export-dialog">
        <form method="dialog">
            <h3 id="faExportTitle">ดาวน์โหลด</h3>
            <p id="faExportInfo"></p>
            <div class="fa-export-options">
                <button type="submit" value="cover" class="fa-btn"><b>ใบปะหน้า</b><small>สรุปรายชื่อ จำนวนครั้ง สถานะส่ง และผลตรวจ พร้อมช่องลงนาม</small></button>
                <button type="submit" value="forms" class="fa-btn"><b>เอกสารออกกำลังกายและฟิตเนสที่เลือก</b><small>แบบฟอร์มรายคน พร้อมรูปทุกครั้งและลายเซ็น</small></button>
                <button type="submit" value="both" class="fa-btn fa-btn-primary"><b>ดาวน์โหลดทั้งคู่</b><small>ใบปะหน้า + เอกสารรายคน ในไฟล์เดียว</small></button>
            </div>
            <button type="submit" value="" class="fa-btn fa-btn-ghost fa-export-cancel">ยกเลิก</button>
        </form>
    </dialog>
    <dialog id="faLightbox" class="fa-lightbox"><button type="button" class="fa-close" data-close-lightbox aria-label="ปิด">×</button><img alt="รูปขยาย"></dialog>
    <div id="faToast" class="fa-toast" role="status"></div>
    <div id="faBusy" class="fa-busy" hidden><div><span class="fa-spinner"></span><b id="faBusyTitle">กำลังสร้างไฟล์…</b><p id="faBusyText"></p><div class="fa-progress"><i id="faBusyBar"></i></div></div></div>

    <script src="config.js"></script>
    <script src="fitness-admin.js?v=20261027-8"></script>
</body>
</html>

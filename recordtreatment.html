<style>
    /* ให้กรอบหลักหน้าเปิดเคสเต็มพื้นที่เท่ากรอบศูนย์รวมงานตลอดเวลา (เดสก์ท็อป) */
    @media (min-width: 901px) {
        /* ส่วนค้นหาที่อยู่เหนือเส้นแบ่งคงที่ ขณะที่ผลการค้นหาและฟอร์มเลื่อนด้านล่าง */
        body.insurance-open-treatment-mode .employee-search-sticky-header {
            display: grid;
            position: sticky;
            z-index: 20;
            top: 0;
            grid-column: 1 / -1;
            grid-template-columns: minmax(220px, 240px) minmax(320px, 440px) minmax(0, 1fr);
            gap: 0 20px;
            align-items: center;
            background: #ffffff;
        }

        body.insurance-open-treatment-mode {
            height: auto !important;
            min-height: 100dvh !important;
            padding: 0 !important;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            scrollbar-color: #f4f7f9 #f4f7f9;
        }

        body.insurance-open-treatment-mode .insurance-workspace-layout {
            width: 100% !important;
            height: auto !important;
            min-height: 100dvh !important;
            padding: 0 !important;
        }

        body.insurance-open-treatment-mode .insurance-open-treatment-view,
        body.insurance-open-treatment-mode .open-case-combined-card {
            height: auto !important;
            min-height: 100dvh !important;
        }

        body.insurance-open-treatment-mode .open-case-combined-card {
            overflow: visible !important;
        }

        body.insurance-open-treatment-mode::-webkit-scrollbar {
            width: 10px;
            background: #f4f7f9;
        }

        body.insurance-open-treatment-mode::-webkit-scrollbar-thumb {
            background: #f4f7f9;
        }
    }

    /* ลดช่องว่างเฉพาะหลังจากเลือกพนักงานในหน้าเปิดเคสแล้ว */
    .insurance-open-treatment-view
        .open-case-combined-card:has(.employee-result-option.selected)
        .open-case-form-section {
        margin-top: -24px;
        padding-top: 0;
    }

    .insurance-open-treatment-view
        .open-case-combined-card:has(.employee-result-option.selected)
        .treatment-panel-heading.panel-dark-header {
        min-height: 40px;
        margin-bottom: 0 !important;
        padding-top: 4px !important;
        padding-bottom: 4px !important;
    }

    .insurance-open-treatment-view
        .open-case-combined-card:has(.employee-result-option.selected)
        #claimForm {
        padding-top: 4px;
    }
</style>

<div class="card-container middle-box insurance-panel-shell">
    <!-- 🔴 ส่วนหัวเรื่อง: จัดการแยกกล่องหัวข้อหลักและเวลาปัจจุบันสีแดงเป็น 2 บรรทัดตามดีไซน์อย่างถูกต้อง -->
    <div class="treatment-panel-heading insurance-box-heading panel-dark-header">
        <!-- ฝั่งซ้าย: หัวข้อหลัก -->
        <h2 class="insurance-box-title" style="margin: 0; border: none; padding: 0;">📋 บันทึกข้อมูลการเข้ารักษา(เปิดเคส)</h2>
        
        <!-- วันเวลาระบบ: recordtreatment.js จะย้ายไปกึ่งกลางแถบด้านบนเฉพาะหน้าเปิดเคส -->
        <div id="headerDateTimeContainer" style="text-align: center; line-height: 1.25; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
            <span style="font-size: 9.75px; font-weight: 700; color: #344054; display: block; margin-bottom: 1px;">วันเวลาในระบบปัจจุบัน (24 ชม.)</span>
            <span id="headerDateTimeValue" style="color: #102a56; font-size: 12px; font-weight: 800; display: block;"></span>
        </div>
    </div>

    <!-- 📥 เริ่มต้นฟอร์มหลัก -->
     <form id="claimForm">
        <!-- 🎯 แก้ไขเพิ่มช่องซ่อนให้ครบทุกตัวสะกด เพื่อให้คำสั่งหน้าบ้านมีช่องหยอดค่าชื่อพนักงานและรหัสประกันได้ 100% -->
        <input type="hidden" id="hiddenEmpName">
        <input type="hidden" id="employeeName"> <!-- เพิ่มเผื่อตัวสะกดนี้ -->
        
        <input type="hidden" id="hiddenInsuranceId">
        <input type="hidden" id="insuranceId"> <!-- เพิ่มเผื่อตัวสะกดนี้ -->
        
        <input type="hidden" id="hiddenCompany">
        <input type="hidden" id="hiddenSize">
        <input type="hidden" id="hiddenWorkLocation">
        
        <div class="treatment-field-grid">
        <!-- ช่องระบุวันที่เข้ารับการรักษา -->
        <div class="claim-row treatment-field treatment-field-compact treatment-field-date">
            <label class="claim-label" for="manualDate">ระบุวันที่เข้ารับการรักษา :</label>
            <div class="value-text">
                <input type="text" id="manualDate" placeholder="📅 คลิกเลือกวันที่เข้ารักษา..." disabled style="background-color: #e9ecef; cursor: text;">
            </div>
        </div>

        <!-- ช่องระบุเวลาที่เข้ารับการรักษา -->
        <div class="claim-row treatment-field treatment-field-compact treatment-field-time">
            <label class="claim-label" for="manualTime">ระบุเวลาที่เข้ารับการรักษา :</label>
            <div class="value-text">
                <input type="text" id="manualTime" placeholder="⏰ คลิกเลือกเวลาที่เข้ารักษา..." disabled style="background-color: #e9ecef; cursor: text;">
            </div>
        </div>

        <!-- ช่องที่ 3: เคส ID -->
        <div class="claim-row treatment-field treatment-field-compact treatment-field-case">
            <label class="claim-label" for="caseId">เคส ID :</label>
            <div class="value-text">
                <input type="text" id="caseId" readonly placeholder="กำลังคำนวณเลขเคสถัดไป...">
            </div>
        </div>

        <!-- ช่องที่ 4: คลินิกหรือสถานพยาบาล -->
        <div class="claim-row treatment-field treatment-field-hospital">
            <label class="claim-label" for="hospitalSelect">คลินิกหรือสถานพยาบาล :<span class="required">*</span></label>
            <div class="value-text">
                <select id="hospitalSelect" required disabled style="background-color: #e9ecef; cursor: default;">
                    <option value="" disabled selected>-- กรุณาเลือกสถานพยาบาล --</option>
                    <option value="รอยัล อังกอร์">รอยัล อังกอร์</option>
                    <option value="จัสมิน คลินิก">จัสมิน คลินิก</option>
                    <option value="เทวิน ข้างฮุยเกียร์">เทวิน ข้างฮุยเกียร์</option>
                    <option value="คลินิกโซน 3">คลินิกโซน 3</option>
                    <option value="คลินิก สุวิสา">คลินิก สุวิสา</option>
                    <option value="คลินิกไทยช่าง (ท้ายคลัง)">คลินิกไทยช่าง (ท้ายคลัง)</option>
                    <option value="คลินิกวงเทพ">คลินิกวงเทพ</option>
                    <option value="คลินิกโอเคทินนา">คลินิกโอเคทินนา</option>
                    <option value="คลินิกอิลิแก้นต์">คลินิกอิลิแก้นต์</option>
                    <option value="คลินิกกาแล็คซี่">คลินิกกาแล็คซี่</option>
                    <option value="Durdans hospital">Durdans hospital</option>
                    <option value="Clinic Dr. Menghong">Clinic Dr. Menghong</option>
                    <option value="Akea Thmey Clinic">Akea Thmey Clinic </option>
                    <option value="Dermall Dental Clinic">Dermall Dental Clinic</option>
                    <option value="king hospital">king hospital</option>
                    <option value="Nawaloka Hospital">Nawaloka Hospital</option>
                    <option value="TPR DENTAL CARE">TPR DENTAL CARE </option>
                    <option value="คลินิกทำฟันอื่นๆ PP">คลินิกทำฟันอื่นๆ PP</option>
                    <option value="อื่นๆ กรุงเทพและปริมณฑล">อื่นๆ กรุงเทพและปริมณฑล</option>
                    <option value="อื่นๆ ต่างจังหวัด">อื่นๆ ต่างจังหวัด</option>
                </select>
            </div>
        </div>

        <!-- ช่องที่ 5: ระยะทาง -->
        <div class="claim-row treatment-field treatment-field-compact treatment-field-distance">
            <label class="claim-label" for="distanceInput">ระยะทางอ้างอิง :</label>
            <div class="value-text">
                <input type="text" id="distanceInput" readonly placeholder="ระยะทาง google map">
            </div>
        </div>

        <!-- ช่องที่ 6: อาการป่วย -->
        <div class="claim-row align-top treatment-field treatment-field-long">
            <label class="claim-label" for="symptomsInput">อาการป่วย :<span class="required">*</span></label>
            <div class="value-text">
                <textarea id="symptomsInput" required placeholder="กรอกรายละเอียดอาการป่วยอย่างละเอียด..." disabled style="background-color: #e9ecef; cursor: text;"></textarea>
            </div>
        </div>

        

        <!-- ช่องที่ 7: หมายเหตุ -->
        <div class="claim-row align-top treatment-field treatment-field-long">
            <label class="claim-label" for="notesInput">หมายเหตุเพิ่มเติม :</label>
            <div class="value-text">
                <textarea id="notesInput" placeholder="ระบุข้อมูลเพิ่มเติมอื่นๆ (ถ้ามี)..." disabled style="background-color: #e9ecef; cursor: text;"></textarea>
            </div>
        </div>
        </div>


        <div class="treatment-form-footer">
        <!-- เริ่มต้นโซนอัปโหลดรูปภาพ -->
        <div class="treatment-upload-field">
            <label style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px;">
                📸 รูปภาพหลักฐานแจ้งเคสประกัน :
            </label>
            <div data-permission="UploadFiles" style="display: flex; gap: 10px; align-items: center;">
                <!-- ปุ่มกดเลือกไฟล์ที่ซ่อนหน้าตาเดิมไว้ แล้วแต่งให้เข้ากับธีม -->
                <label for="imageUpload" style="padding: 8px 16px; background-color: #f8f9fa; border: 1px solid #ced4da; color: #495057; border-radius: 4px; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: 0.2s;">
                    📁 เลือกรูปภาพเปิดเคส
                </label>
                <input
                    type="file"
                    id="imageUpload"
                    accept="image/jpeg,image/png,image/webp"
                    style="display:none;"
                    onchange="updateFileName(); previewSelectedImage(this, 'openCasePreview');">

                <div id="openCasePreview" class="upload-image-preview"></div>
                
                <!-- ข้อความแสดงชื่อไฟล์ที่ถูกเลือก -->
                <span id="fileNameDisplay" style="font-size: 13px; color: #6c757d;">ยังไม่ได้เลือกไฟล์</span>
            </div>
        </div>
        <!-- สิ้นสุดโซนอัปโหลดรูปภาพ -->

        <div class="treatment-form-actions">
            <!-- 📋 [เพิ่มปุ่มคัดลอกข้อความแจ้งประกันเข้าสู่ระบบ] -->
            <button type="button" id="btnCopyToClaim" onclick="copyClaimDetailsToClipboard()" class="treatment-copy-button">
                📋 คัดลอกข้อความไปแจ้งประกัน
            </button>

            <!-- ปุ่มสำหรับกดส่งข้อมูล บันทึกข้อมูลและปิดฟอร์มอย่างเป็นระบบ -->
            <button
                type="submit"
                id="submitBtn"
                class="btn btn-success treatment-submit-button"
            >
                🟢 บันทึกข้อมูลเข้าสู่ระบบ
            </button>
        </div>
        </div>

    </form>

    <div id="claimStatus"></div>

<!-- =================================== 📋 [ส่วนท้ายเรื่อง: เริ่มต้นโครงสร้างกล่องฝั่งขวา - ระบบการเคลม (บันทึกเข้ารักษา)] ======================= -->
 <!-- ปิดกันวงเล็บเพื่อแยกส่วนบนและล่าง -->

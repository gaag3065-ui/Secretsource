<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>จัดการพนักงาน | GA Operations</title>
    <link rel="stylesheet" href="fitness-admin.css?v=20261102-2">
    <link rel="stylesheet" href="staff-management.css?v=20261103-1">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
</head>
<body>
    <main class="fa-page">
        <header class="fa-head">
            <div>
                <p class="fa-eyebrow">STAFF MANAGEMENT · หลังบ้าน</p>
                <h1>จัดการพนักงาน</h1>
                <p class="fa-sub">รายชื่อจากแท็บ "ข้อมูลเบื้องต้น" — จัดงาน มอบหมาย และติดตามงานของพนักงานแต่ละคน <span id="smUpdated"></span></p>
            </div>
            <div class="fa-actions">
                <a class="fa-btn fa-btn-primary" href="https://gaag3065-ui.github.io/Secretsource/ga-docs.html" target="_blank" rel="noopener">กิจการภายใน ↗</a>
                <button type="button" class="fa-btn fa-btn-ghost" data-action="refresh">รีเฟรชข้อมูล</button>
            </div>
        </header>

        <section class="fa-stats" id="smStats"></section>

        <section class="fa-toolbar sm-toolbar">
            <select id="smCompany" data-filter="company"><option value="">ทุกบริษัท</option></select>
            <select id="smStatus" data-filter="status"><option value="">ทุกสถานะปัจจุบัน</option></select>
            <select id="smArea" data-filter="area"><option value="">ทุกพื้นที่รันงาน</option></select>
            <select id="smBuilding" data-filter="building"><option value="">ทุกตึก</option></select>
            <select id="smFloor" data-filter="floor"><option value="">ทุกชั้น</option></select>
            <select id="smRoom" data-filter="room"><option value="">ทุกห้อง</option></select>
            <select id="smSize" data-filter="size"><option value="">ทุก Size</option></select>
            <select id="smContract" data-filter="contractText"><option value="">สัญญาเช่าบ้าน SL ทั้งหมด</option></select>
            <select id="smTask">
                <option value="">งาน: ทั้งหมด</option>
                <option value="open">มีงานค้าง</option>
                <option value="none">ยังไม่มีงาน</option>
                <option value="done">มีงานเสร็จแล้ว</option>
            </select>
            <input id="smSearch" type="search" placeholder="ค้นหาชื่อ รหัสพนักงาน รหัสประกัน รายละเอียด…" autocomplete="off">
            <button type="button" class="fa-btn fa-btn-ghost" data-action="clear-filters">ล้างตัวกรอง</button>
        </section>
        <p class="sm-count" id="smCount"></p>

        <section class="fa-card">
            <div class="fa-table-wrap">
                <table>
                    <thead><tr><th>พนักงาน</th><th>บริษัท</th><th>สถานะปัจจุบัน</th><th>พื้นที่รันงาน</th><th>ที่พัก (ตึก · ชั้น · ห้อง)</th><th id="smSizeHead">Size</th><th>สัญญาเช่าบ้าน SL</th><th id="smDetailHead">รายละเอียด</th><th>งานที่มอบหมาย</th><th></th></tr></thead>
                    <tbody id="smRows"><tr><td colspan="10" class="fa-empty">กำลังโหลด…</td></tr></tbody>
                </table>
            </div>
        </section>
    </main>

    <dialog id="smDialog" class="fa-dialog sm-dialog">
        <div id="smDetail"></div>
    </dialog>
    <div id="smToast" class="fa-toast" role="status"></div>

    <script src="config.js"></script>
    <script src="staff-management.js?v=20261103-1"></script>
</body>
</html>

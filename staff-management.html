<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>จัดการพนักงาน | GA Operations</title>
    <link rel="stylesheet" href="fitness-admin.css?v=20261102-2">
    <link rel="stylesheet" href="staff-management.css?v=20261109-claim-2">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
</head>
<body>
    <main class="fa-page">
        <header class="fa-head">
            <div>
                <p class="fa-eyebrow">STAFF MANAGEMENT · หลังบ้าน</p>
                <h1>จัดการพนักงาน</h1>
                <p class="fa-sub">รายชื่อจากแท็บ "ข้อมูลเบื้องต้น" — จัดงาน มอบหมาย และติดตามงานของพนักงานแต่ละคน <span id="smUpdated"></span></p>
            </div>
            <div class="fa-actions">
                <a class="fa-btn fa-btn-primary" href="https://gaag3065-ui.github.io/Secretsource/ga-docs.html" target="_blank" rel="noopener">กิจการภายใน ↗</a>
                <button type="button" class="fa-btn fa-btn-ghost" data-action="line-match" title="จับคู่ห้องแชท LINE ทุกห้องกับพนักงาน แล้วใส่แท็กรหัสพนักงาน (ส่วนกลาง) ในหน้า Monitoring">🔗 จับคู่ห้อง LINE</button>
                <button type="button" class="fa-btn fa-btn-ghost" data-action="import-claimed" title="นำเข้าไฟล์รายชื่อพนักงานที่ส่งเบิกไปแล้ว (.json) เพื่อแสดงยอดที่เบิกแล้วและกันยืนยันลงรายงานซ้ำ">📥 นำเข้ารายชื่อส่งเบิกแล้ว</button>
                <input type="file" id="smClaimFile" accept=".json,application/json" hidden>
                <button type="button" class="fa-btn fa-btn-ghost" data-action="refresh">รีเฟรชข้อมูล</button>
            </div>
        </header>

        <section class="fa-stats" id="smStats"></section>

        <!-- กล่องงานทั้งหมด (เหมือนหน้า ระบบจัดการองค์กร) มุมขวาบน = จำนวนคนที่ได้รับมอบหมาย — กดเพื่อกรองตาราง -->
        <section class="sm-boxes" id="smBoxes" aria-label="กล่องงานทั้งหมด"></section>

        <section class="fa-toolbar sm-toolbar">
            <!-- ตัวกรองสร้างจาก staff-management.js (FILTERS) — ช่องเสริมแสดงในตารางเมื่อเลือกตัวกรองนั้น -->
            <span id="smFilters" class="sm-filters"></span>
            <select id="smTask">
                <option value="">งาน : ทั้งหมด</option>
                <option value="open">งาน : มีงานค้าง</option>
                <option value="none">งาน : ยังไม่มีงาน</option>
                <option value="done">งาน : มีงานเสร็จแล้ว</option>
                <option value="review">งาน : ส่งเอกสารมา รอตรวจ</option>
            </select>
            <select id="smStage" title="กรองตามขั้นตอนของกล่องงาน">
                <option value="">ขั้นตอน : ทั้งหมด</option>
                <option value="unread">① ยังไม่รับทราบ</option>
                <option value="read">② รับทราบแล้ว (ยังไม่ส่งข้อมูล)</option>
                <option value="sent">③ ส่งข้อมูล/เอกสารแล้ว รอตรวจ</option>
                <option value="more">③ ขอเอกสารเพิ่มแล้ว (รอพนักงานส่งกลับ)</option>
                <option value="checked">④ ตรวจสอบแล้ว รอยืนยันลงรายงาน</option>
                <option value="reported">⑤ ยืนยันลงรายงานแล้ว</option>
                <option value="closed">⑥ เสร็จสิ้น (ปิดกล่องแล้ว)</option>
            </select>
            <select id="smClaim" title="กรองตามการส่งเบิก (ตามรายชื่อที่นำเข้า)">
                <option value="">การเบิก : ทั้งหมด</option>
                <option value="yes">💸 ส่งเบิกแล้ว</option>
                <option value="no">ยังไม่เคยส่งเบิก</option>
            </select>
            <input id="smSearch" type="search" placeholder="ค้นหาชื่อ ชื่อเล่น รหัสพนักงาน รหัสประกัน…" autocomplete="off">
            <button type="button" class="fa-btn fa-btn-ghost" data-action="clear-filters">ล้างตัวกรอง</button>
        </section>
        <p class="sm-count" id="smCount"></p>

        <section class="fa-card">
            <div class="fa-table-wrap">
                <table>
                    <thead><tr id="smHead"></tr></thead>
                    <tbody id="smRows"><tr><td colspan="6" class="fa-empty">กำลังโหลด…</td></tr></tbody>
                </table>
            </div>
        </section>
    </main>

    <dialog id="smDialog" class="fa-dialog sm-dialog">
        <div id="smDetail"></div>
    </dialog>
    <div id="smToast" class="fa-toast" role="status"></div>

    <script src="config.js"></script>
    <script src="staff-management.js?v=20261112-batch-1"></script>
</body>
</html>

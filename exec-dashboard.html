<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>แดชบอร์ดผู้บริหาร | GA Executive</title>
    <link rel="stylesheet" href="exec-dashboard.css?v=20261110-4">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
</head>
<body>
<header class="ex-top">
    <div class="ex-bar">
        <div class="ex-title"><b>แดชบอร์ดผู้บริหาร</b><small>สรุปงาน GA · อ่านอย่างเดียว</small></div>
        <div class="ex-range" id="exRangeBox">
            <select id="exPreset" aria-label="ช่วงเวลา">
                <option value="7">7 วันล่าสุด</option>
                <option value="30" selected>30 วันล่าสุด</option>
                <option value="90">90 วันล่าสุด</option>
                <option value="month">เดือนนี้</option>
                <option value="custom">กำหนดเอง…</option>
            </select>
            <span id="exCustom" hidden><input type="date" id="exFrom" aria-label="ตั้งแต่"> – <input type="date" id="exTo" aria-label="ถึง"></span>
            <button type="button" id="exRefresh" class="ex-btn">รีเฟรช</button>
        </div>
        <div class="ex-user"><span id="exUser"></span><button type="button" id="exLogout" class="ex-btn">ออกจากระบบ</button></div>
    </div>
    <nav class="ex-nav" id="exNav" aria-label="เมนูแดชบอร์ด">
        <button type="button" data-view="overview" class="is-on">📊 ภาพรวม</button>
        <button type="button" data-view="insurance">🏥 ประกัน</button>
        <button type="button" data-view="assets">📦 ทรัพย์สิน</button>
        <button type="button" data-view="welfare">🎁 สวัสดิการ</button>
        <button type="button" data-view="rooms">🏠 ห้องพัก</button>
        <button type="button" data-view="people">👥 ทีม GA</button>
        <button type="button" data-view="report">📑 รายงาน</button>
    </nav>
</header>

<main class="ex-main">
    <p id="exStatus" class="ex-status" role="status">กำลังโหลด…</p>
    <section id="v-overview" class="ex-pane"></section>
    <section id="v-insurance" class="ex-pane" hidden></section>
    <section id="v-assets" class="ex-pane" hidden></section>
    <section id="v-welfare" class="ex-pane" hidden></section>
    <section id="v-rooms" class="ex-pane" hidden></section>
    <section id="v-people" class="ex-pane" hidden></section>
    <section id="v-report" class="ex-pane" hidden></section>
    <footer id="exFoot" class="ex-foot"></footer>
</main>

<dialog id="exDialog" class="ex-dialog"><div id="exDetail"></div></dialog>

<script src="config.js"></script>
<script src="exec-dashboard.js?v=20261110-3"></script>
</body>
</html>

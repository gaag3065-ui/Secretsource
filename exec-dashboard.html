<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>แดชบอร์ดผู้บริหาร | GA Executive</title>
    <link rel="stylesheet" href="exec-dashboard.css?v=20261110-1">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
</head>
<body>
<header class="ex-top">
    <a class="ex-back" href="portal.html">← กลับหน้าหลัก</a>
    <div class="ex-title"><b>แดชบอร์ดผู้บริหาร</b><small>สรุปงาน GA · อ่านอย่างเดียว</small></div>
    <div class="ex-range">
        <select id="exPreset" aria-label="ช่วงเวลา">
            <option value="7">7 วันล่าสุด</option>
            <option value="30" selected>30 วันล่าสุด</option>
            <option value="90">90 วันล่าสุด</option>
            <option value="month">เดือนนี้</option>
            <option value="custom">กำหนดเอง…</option>
        </select>
        <span id="exCustom" hidden><input type="date" id="exFrom" aria-label="ตั้งแต่"> – <input type="date" id="exTo" aria-label="ถึง"></span>
        <button type="button" id="exRefresh" class="ex-btn">รีเฟรช</button>
    </div>
</header>

<nav class="ex-tabs" id="exTabs" role="tablist">
    <button role="tab" data-tab="overview" class="is-on">ภาพรวม</button>
    <button role="tab" data-tab="areas">แยกตามงาน</button>
    <button role="tab" data-tab="people">แยกตามคน</button>
    <button role="tab" data-tab="report">รายงาน</button>
</nav>

<main class="ex-main">
    <p id="exStatus" class="ex-status" role="status">กำลังโหลด…</p>
    <section id="tab-overview" class="ex-pane"></section>
    <section id="tab-areas" class="ex-pane" hidden></section>
    <section id="tab-people" class="ex-pane" hidden></section>
    <section id="tab-report" class="ex-pane" hidden></section>
    <footer id="exFoot" class="ex-foot"></footer>
</main>

<dialog id="exDialog" class="ex-dialog"><div id="exDetail"></div></dialog>

<script src="config.js"></script>
<script src="exec-dashboard.js?v=20261110-1"></script>
</body>
</html>

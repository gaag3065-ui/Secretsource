<!DOCTYPE html>

<body>

                <p class="fa-sub">เจ้าหน้าที่ GA ทั้งหมด หน้าที่ที่รับผิดชอบ และสัดส่วนงานของแต่ละคน</p>

        <h2 class="gw-title">เจ้าหน้าที่ GA (STAFF)</h2>

        <section id="gwSections" class="gw-sections"></section>

    <dialog id="gwDialog" class="fa-dialog gw-dialog"><div id="gwEdit"></div></dialog>
    <div id="gwToast" class="fa-toast" role="status"></div>

    <script src="config.js"></script>
    <script src="ga-work.js?v=20261103-1"></script>

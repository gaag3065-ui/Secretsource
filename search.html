
<!DOCTYPE html>
<html lang="th">


<head>
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css?v=20260813-01">
 <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.js"></script>





    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารจัดการพนักงานและบันทึกข้อมูลการเข้ารักษา</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="main-topbar">
    <h1>จัดการงานประกัน</h1>

    <button
        type="button"
        id="mainLogoutButton"
        class="main-topbar-button"
    >
        ออกจากระบบ
    </button>
</header>

<!-- =============================================================================================================================== -->
<!-- =================================== 📦 [ส่วนท้าย: สิ้นสุดระบบรวมโครงสร้างหลักหน้าจอ] =============================================== -->
<!-- =============================================================================================================================== -->



<!-- = ส่วนหน้ารวม = -->
<div class="flex-row-container">


<!-- <div class="card-container left-box">-->
<!-- = ส่วนหน้าค้นหาข้อมูลพนักงาน = -->
<div id="search-box-placeholder" class="card-container left-box"></div>

<!--<div class="card-container middle-box"></div>-->
<!-- = ส่วนหน้าบันทึกข้อมูลเข้ารักษา = -->
<div id="treatment-box-placeholder" style="flex: 1; min-width: 0;"></div>


</div>

<!--<div class="card-container bottom-full-box"></div>-->
<!-- 📦 กล่องรวมขนาดใหญ่ด้านล่าง (Full Width Container) -->
<div id="table-box-placeholder" style="width: 100%; margin-top: 20px;"></div>




<script src="version.js"></script>
<!-- ฟังก์ชันกลางที่ฝั่งขวาและฝั่งล่างใช้ร่วมกัน -->
<script src="ui-utils.js"></script>

<script>
const APP_VERSION = window.APP_VERSION;

//function loadScript(filename) {
//#region
function loadScript(filename) {
    return new Promise((resolve, reject) => {

        const script =
            document.createElement('script');

        script.src =
            `${filename}?v=${APP_VERSION}`;

        script.onload = resolve;

        script.onerror = () =>
            reject(
                new Error(
                    `โหลด ${filename} ไม่สำเร็จ`
                )
            );

        document.body.appendChild(script);
    });
}
//#endregion

//async function loadComponent(placeholderId, filename) {
//#region
async function loadComponent(placeholderId, filename) {
    try {
        const response = await fetch(
            `${filename}?v=${APP_VERSION}`,
            { cache: 'no-store' }
        );

        if (!response.ok) {
            throw new Error(`โหลดไฟล์ ${filename} ไม่สำเร็จ`);
        }

        const htmlContent = await response.text();

        document.getElementById(placeholderId).innerHTML =
            htmlContent;

    } catch (error) {

        console.error(
            `🚨 โหลด ${filename} ไม่สำเร็จ:`,
            error
        );
    }
}
//#endregion

//document.addEventListener("DOMContentLoaded", async () => {
//#region
document.addEventListener("DOMContentLoaded", async () => {

    try {

        // =====================================================
        // 1. โหลด Config ก่อนทุกอย่าง
        // =====================================================
        await loadScript('config.js');

        if (!window.APP_CONFIG) {
            throw new Error('ไม่พบ APP_CONFIG หลังโหลด config.js');
        }


        const sessionResponse = await window.authFetch(
            `${window.APP_CONFIG.API_BASE_URL}/api/session`,
            {
                method: 'GET',
                cache: 'no-store'
            }
        );

        if (!sessionResponse.ok) {
            throw new Error('ไม่สามารถตรวจสอบสถานะการเข้าสู่ระบบได้');
        }

        const sessionData = await sessionResponse.json();

        if (!sessionData.success || !sessionData.user) {
            sessionStorage.clear();
            window.location.replace('index.html');
            return;
        }

            window.USER_PERMISSIONS =
                sessionData.permissions || {};

            window.hasPermission = function (permissionKey) {
                return window.USER_PERMISSIONS[permissionKey] === true;
            };

            function applyPermissionVisibility(root = document) {
                root
                    .querySelectorAll('[data-permission]')
                    .forEach(element => {
                        const permissionKey =
                            element.dataset.permission;

                        element.hidden =
                            !window.hasPermission(permissionKey);
                    });
            }

// =========== [โหลดเฉพาะส่วนที่ได้รับอนุญาต] ========== //
            async function loadPermittedComponent(
                permissionKey,
                placeholderId,
                filename
            ) {
                if (window.hasPermission(permissionKey)) {
                    await loadComponent(placeholderId, filename);
                    return true;
                }

                document.getElementById(placeholderId).innerHTML = `
                    <div style="
                        padding: 24px;
                        border: 1px solid #d1d5db;
                        border-radius: 6px;
                        background: #f9fafb;
                        color: #6b7280;
                        text-align: center;
                    ">
                        บัญชีนี้ไม่มีสิทธิ์เข้าถึงส่วนนี้
                    </div>
                `;

                return false;
            }
// =========== [โหลดเฉพาะส่วนที่ได้รับอนุญาต] ========== //


        sessionStorage.setItem(
            'loggedInAdminName',
            sessionData.user.name || sessionData.user.username
        );


        console.log(
            `⚙️ Config พร้อมใช้งาน | Version: ${APP_VERSION}`
        );


        // =====================================================
        // 2. โหลด HTML ย่อย
        // =====================================================
            const canSearch = await loadPermittedComponent(
                'SearchData',
                'search-box-placeholder',
                'searchinformation.html'
            );

            const canCreate = await loadPermittedComponent(
                'CreateTreatment',
                'treatment-box-placeholder',
                'recordtreatment.html'
            );

            const canViewHistory = await loadPermittedComponent(
                'ViewHistory',
                'table-box-placeholder',
                'insuranceclaimhistory.html'
            );

        console.log(
            "🎮 โครงสร้าง HTML ประกอบร่างรวมศูนย์สำเร็จ!"
        );


        // =====================================================
        // 3. เปิดใช้งาน Flatpickr
        // =====================================================
        flatpickr("#manualDate", {
            dateFormat: "d/m/Y",
            defaultDate: "today",
            allowInput: true
        });

        flatpickr("#manualTime", {
            enableTime: true,
            noCalendar: true,
            dateFormat: "H:i",
            time_24hr: true,
            defaultDate: new Date(),
            allowInput: true
        });

        flatpickr("#mdManualDate", {
            dateFormat: "d/m/Y",
            allowInput: true
        });

        flatpickr("#mdManualTime", {
            enableTime: true,
            noCalendar: true,
            dateFormat: "H:i",
            time_24hr: true,
            allowInput: true
        });

        flatpickr("#ocManualDate", {
            dateFormat: "d/m/Y",
            allowInput: true
        });

        flatpickr("#ocManualTime", {
            enableTime: true,
            noCalendar: true,
            dateFormat: "H:i",
            time_24hr: true,
            allowInput: true
        });


        // =====================================================
        // 4. โหลด Script ฝั่งซ้าย
        // =====================================================
            if (canSearch) {
                await loadScript('searchinformation.js');

                if (typeof initSearchBoxEvents === 'function') {
                    initSearchBoxEvents();
                }
            }


        // =====================================================
        // 5. โหลด Script ฝั่งขวา
        // =====================================================
                if (canCreate) {
                await loadScript('recordtreatment.js');

                if (typeof initHospitalEvents === 'function') {
                    initHospitalEvents();
                }

                if (typeof setThaiDateTime === 'function') {
                    setThaiDateTime();
                }

                if (typeof fetchNextCaseId === 'function') {
                    fetchNextCaseId();
                }
            }


        // =====================================================
        // 6. โหลด Script ฝั่งล่าง
        // =====================================================
            if (canViewHistory) {
                await loadScript('insuranceclaimhistory.js');
                const mainLogoutButton =
                    document.getElementById(
                        'mainLogoutButton'
                    );

                if (mainLogoutButton) {
                    mainLogoutButton.addEventListener(
                        'click',
                        () => {
                            const confirmed = confirm(
                                'คุณต้องการออกจากระบบใช่หรือไม่?'
                            );

                            if (!confirmed) return;

                            sessionStorage.clear();
                            window.location.replace('index.html');
                        }
                    );
                }

                if (typeof initHistoryModalEvents === 'function') {
                    initHistoryModalEvents();
                }

                if (typeof applyPermissionVisibility === 'function') {
                    applyPermissionVisibility();
                }

                if (typeof initHistoryFilterDates === 'function') {
                    initHistoryFilterDates();
                }

                if (typeof initAdvancedHistoryFilterEvents === 'function') {
                    initAdvancedHistoryFilterEvents();
                }

                if (
                    typeof initHistoryFilterApplyEvent
                    === 'function'
                ) {
                    initHistoryFilterApplyEvent();
                }

                if (
                    typeof initHistoryReportEvent
                    === 'function'
                ) {
                    initHistoryReportEvent();
                }


            }


        console.log(
            `✅ Secretsource Frontend พร้อมใช้งาน | Version ${APP_VERSION}`
        );

    } catch (error) {

        console.error(
            "🚨 ระบบเริ่มต้นหน้าเว็บล้มเหลว:",
            error
        );
 
        alert(
            `ระบบโหลดหน้าเว็บไม่สมบูรณ์\n${error.message}`
        );
    }
});
//#endregion
</script>

</body>
</html>
